model_list:
  # Chutes' Chat Completions endpoint is used when Claude Code sends Messages
  # requests through LiteLLM. The wildcard preserves the requested model ID.
  - model_name: chutes/*
    litellm_params:
      model: openai/*
      api_base: https://llm.chutes.ai/v1
      api_key: os.environ/CHUTES_API_KEY
      max_parallel_requests: 5

  # Codex uses Chutes' separate Responses-compatible endpoint.
  - model_name: chutes-responses/*
    litellm_params:
      model: openai/*
      api_base: https://responses.chutes.ai/v1
      api_key: os.environ/CHUTES_API_KEY
      max_parallel_requests: 5

  # Any OpenRouter model can be selected at request time.
  - model_name: openrouter/*
    litellm_params:
      model: openrouter/*
      api_key: os.environ/OPENROUTER_API_KEY

  # modelctl loads the selected local model with this stable identifier.
  - model_name: local/model
    litellm_params:
      model: openai/local/model
      api_base: http://lmstudio:1234/v1
      api_key: lm-studio

  # The embedding route is available only while the optional local profile runs.
  - model_name: text-embedding-nomic-embed-text-v1.5
    litellm_params:
      model: openai/text-embedding-nomic-embed-text-v1.5
      api_base: http://lmstudio:1234/v1
      api_key: lm-studio

litellm_settings:
  # Strip provider-specific parameters that upstream endpoints do not accept.
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
