model_list:
  # Chat model — both aliases so clients using either name work
  - model_name: gpt-oss-20b
    litellm_params:
      model: openai/openai/gpt-oss-20b
      api_base: http://lmstudio:1234/v1
      api_key: lm-studio

  - model_name: openai/gpt-oss-20b
    litellm_params:
      model: openai/openai/gpt-oss-20b
      api_base: http://lmstudio:1234/v1
      api_key: lm-studio

  # Embedding model
  - model_name: text-embedding-nomic-embed-text-v1.5
    litellm_params:
      model: openai/text-embedding-nomic-embed-text-v1.5
      api_base: http://lmstudio:1234/v1
      api_key: lm-studio

litellm_settings:
  # Strip unknown params instead of erroring — LM Studio ignores many OpenAI fields
  drop_params: true

general_settings:
  master_key: lm-studio
