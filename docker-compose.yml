services:
  # LM Studio runs only when the local profile is enabled. It is CPU-compatible
  # by default; use docker-compose.nvidia.yml to expose NVIDIA GPUs.
  lmstudio:
    build:
      context: .
      dockerfile: Dockerfile.lmstudio
    container_name: lmstudio
    profiles: ["local"]
    environment:
      - LMS_SERVER_HOST=0.0.0.0
      - LMS_SERVER_PORT=1234
      - LOCAL_CONTEXT_WINDOW=${LOCAL_CONTEXT_WINDOW:-65536}
      - LOCAL_GPU_OFFLOAD=${LOCAL_GPU_OFFLOAD:-}
      - LMSTUDIO_STARTUP_STATE_FILE=/var/lib/local-llm-stack/lmstudio-startup.env
      - HF_TOKEN=${HF_TOKEN:-}
    volumes:
      - lmstudio_models:/root/.lmstudio/models
      - ./model-selection:/var/lib/local-llm-stack:ro
    ports:
      - "127.0.0.1:1234:1234"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:1234/v1/models >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - all-net

  # LiteLLM: OpenAI-compatible proxy/router for cloud model providers. Provides
  # a single gateway (port 4000) for the coding agents.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ./litellm-entrypoint.sh:/app/litellm-entrypoint.sh:ro
    # See LITELLM_DEBUG_MODE in .env. Keep debug gateway logs local.
    entrypoint: ["/bin/sh", "/app/litellm-entrypoint.sh"]
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      - CHUTES_API_KEY=${CHUTES_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - LITELLM_DEBUG_MODE=${LITELLM_DEBUG_MODE:-off}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - all-net

  # SearXNG: self-hosted meta search engine (port 8081). Used as a web-search
  # backend for the agents via the MCP search server.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - all-net

  # VS Code workspace: dev container for the VS Code extension-based agent
  # (Cline/Codex). Includes a full C/C++ toolchain and MCP servers, and talks
  # directly to LM Studio for the responses API.
  workspace:
    build:
      context: .
      dockerfile: Dockerfile.vscode-workspace
    container_name: vscode-workspace
    restart: unless-stopped
    init: true
    user: vscode
    command:
      - bash
      - -lc
      - "modelctl apply; exec sleep infinity"
    volumes:
      - ./workspaces:/workspaces
      - vscode_server:/home/vscode/.vscode-server
      - vscode_server_insiders:/home/vscode/.vscode-server-insiders
      - vscode_data:/home/vscode/.config/Code
      - vscode_memory:/home/vscode/.mcp-memory
      - ./model-selection:/var/lib/local-llm-stack
    environment:
      - LM_STUDIO_BASE_URL=http://lmstudio:1234/v1
      - OPENAI_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      - CODEX_LITELLM_API_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      - MODELCTL_APP=codex
      - MODEL_STATE_FILE=/var/lib/local-llm-stack/selected.env
      - DEFAULT_MODEL_PROVIDER=${DEFAULT_MODEL_PROVIDER:-chutes}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-deepseek-ai/DeepSeek-V3.2-TEE}
      - HOME=/home/vscode
    depends_on:
      litellm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      searxng:
        condition: service_healthy
    networks:
      - all-net

  # Qdrant: vector database (port 6333) backing the MCP memory/RAG servers
  # used by the workspace and codex agents.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - all-net

  # Codex CLI workspace: headless container running the OpenAI Codex CLI agent
  # with a full C/C++ toolchain and MCP servers.
  codex:
    build:
      context: .
      dockerfile: Dockerfile.codex
    container_name: codex-cli-workspace
    restart: unless-stopped
    init: true
    command:
      - bash
      - -lc
      - "modelctl apply; exec sleep infinity"
    volumes:
      - ./workspaces:/workspaces
      - codex_cli_workspace_memory:/home/codex/.mcp-memory
      - ./model-selection:/var/lib/local-llm-stack
    environment:
      - CODEX_LM_STUDIO_API_KEY=lm-studio
      - CODEX_LITELLM_API_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      - MODELCTL_APP=codex
      - MODEL_STATE_FILE=/var/lib/local-llm-stack/selected.env
      - DEFAULT_MODEL_PROVIDER=${DEFAULT_MODEL_PROVIDER:-chutes}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-deepseek-ai/DeepSeek-V3.2-TEE}
      - HOME=/home/codex
    depends_on:
      litellm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      searxng:
        condition: service_healthy
    networks:
      - all-net

  # Claude Code CLI workspace: mirrors the Codex development image.
  claude-code:
    build:
      context: .
      dockerfile: Dockerfile.claude-code
    container_name: claude-code-cli-workspace
    restart: unless-stopped
    init: true
    command:
      - bash
      - -lc
      - "test -f /home/claude/.claude.json || printf '{}\\n' > /home/claude/.claude.json; modelctl apply; configure-claude-mcp /home/claude/.claude.json; exec sleep infinity"
    volumes:
      - ./workspaces:/workspaces
      - claude_code_home:/home/claude
      - ./model-selection:/var/lib/local-llm-stack
    environment:
      - LITELLM_API_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env}
      - MODELCTL_APP=claude
      - MODEL_STATE_FILE=/var/lib/local-llm-stack/selected.env
      - DEFAULT_MODEL_PROVIDER=${DEFAULT_MODEL_PROVIDER:-chutes}
      - DEFAULT_MODEL=${DEFAULT_MODEL:-deepseek-ai/DeepSeek-V3.2-TEE}
      - HOME=/home/claude
    depends_on:
      litellm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      searxng:
        condition: service_healthy
    networks:
      - all-net

networks:
  all-net:
    driver: bridge

volumes:
  lmstudio_models:
  qdrant_data:
  codex_cli_workspace_memory:
  vscode_memory:
  vscode_server:
  vscode_server_insiders:
  vscode_data:
  claude_code_home:
