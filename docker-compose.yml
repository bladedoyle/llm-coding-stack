services:
  # LM Studio: GPU-accelerated local LLM server. Hosts the gpt-oss-20b model
  # and exposes an OpenAI-compatible API (chat + /v1/responses) on port 1234.
  lmstudio:
    build:
      context: .
      dockerfile: Dockerfile.lmstudio
    container_name: lmstudio
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - LMS_SERVER_HOST=0.0.0.0
      - LMS_SERVER_PORT=1234
    volumes:
      - lmstudio_models:/root/.lmstudio/models
    ports:
      - "1234:1234"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:1234/v1/models >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - all-net

  # LiteLLM: OpenAI-compatible proxy/router in front of LM Studio. Provides a
  # single gateway (port 4000) for chat clients like Open WebUI.
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: litellm
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm_config.yaml:/app/config.yaml:ro
      - ./litellm-entrypoint.sh:/app/litellm-entrypoint.sh:ro
    # See LITELLM_DEBUG_MODE in .env. Keep detailed gateway logs local.
    entrypoint: ["/bin/sh", "/app/litellm-entrypoint.sh"]
    environment:
      - LITELLM_MASTER_KEY=lm-studio
      - CHUTES_API_KEY=${CHUTES_API_KEY:-}
      - CHUTES_MODEL=${CHUTES_MODEL:-deepseek-ai/DeepSeek-V3.2-TEE}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-tencent/hy3:free}
      - LITELLM_DEBUG_MODE=${LITELLM_DEBUG_MODE:-detailed}
    depends_on:
      lmstudio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')\" 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - all-net

  # Open WebUI: web chat front-end (port 3000). Talks to LiteLLM for LLM
  # responses, Kokoro for text-to-speech, and Whisper for speech-to-text.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - ENABLE_OLLAMA_API=False
      - ENABLE_OPENAI_API=True
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=lm-studio
      - AUDIO_TTS_ENGINE=openai
      - AUDIO_TTS_OPENAI_API_BASE_URL=http://kokoro:8880/v1
      - AUDIO_TTS_OPENAI_API_KEY=sk-placeholder
      - AUDIO_TTS_MODEL=kokoro
      - AUDIO_TTS_VOICE=af_bella
      - AUDIO_STT_ENGINE=whisper
      - AUDIO_STT_WHISPER_MODEL=base
    volumes:
      - webui_data:/app/backend/data
    depends_on:
      litellm:
        condition: service_healthy
      kokoro:
        condition: service_started
    restart: unless-stopped
    networks:
      - all-net

  # SearXNG: self-hosted meta search engine (port 8081). Used as a web-search
  # backend for the agents via the MCP search server.
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - all-net

  # Kokoro: GPU text-to-speech service (port 8880), OpenAI-compatible TTS API
  # consumed by Open WebUI for voice output.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:v0.1.4
    container_name: kokoro
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    ports:
      - "127.0.0.1:8880:8880"
    restart: unless-stopped
    networks:
      - all-net

  # VS Code workspace: dev container for the VS Code extension-based agent
  # (Cline/Codex). Includes a full C/C++ toolchain and MCP servers, and talks
  # directly to LM Studio for the responses API.
  workspace:
    build:
      context: .
      dockerfile: Dockerfile.vscode-workspace
    container_name: vscode-workspace
    restart: unless-stopped
    init: true
    privileged: true
    user: root
    command:
      - bash
      - -lc
      - "install -d -o vscode -g vscode /home/vscode/.vscode-server /home/vscode/.vscode-server-insiders /home/vscode/.config/Code; chown vscode:vscode /home/vscode/.vscode-server /home/vscode/.vscode-server-insiders /home/vscode/.config/Code; configure-codex-provider /home/vscode/.codex/config.toml; configure-codex-provider --chutes-profile /home/vscode/.codex/chutes.config.toml; configure-codex-provider --openrouter-profile /home/vscode/.codex/openrouter.config.toml; dockerd --host=unix:///var/run/docker.sock --storage-driver=vfs >/var/log/dockerd.log 2>&1 & for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done; docker info >/dev/null 2>&1 || { cat /var/log/dockerd.log; exit 1; }; exec sleep infinity"
    volumes:
      - ./workspaces:/workspaces
      - vscode_server:/home/vscode/.vscode-server
      - vscode_server_insiders:/home/vscode/.vscode-server-insiders
      - vscode_data:/home/vscode/.config/Code
      - vscode_memory:/home/vscode/.mcp-memory
      - vscode_dind:/var/lib/docker
    environment:
      - LM_STUDIO_BASE_URL=http://lmstudio:1234/v1
      - OPENAI_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=lm-studio
      - CODEX_LITELLM_API_KEY=lm-studio
      - CHUTES_CONTEXT_WINDOW=${CHUTES_CONTEXT_WINDOW:-65536}
      - LOCAL_CONTEXT_WINDOW=${LOCAL_CONTEXT_WINDOW:-65536}
      - OPENROUTER_CONTEXT_WINDOW=${OPENROUTER_CONTEXT_WINDOW:-98304}
      - LLM_PROVIDER=${LLM_PROVIDER:-chutes}
      - DOCKER_HOST=unix:///var/run/docker.sock
    depends_on:
      lmstudio:
        condition: service_healthy
      litellm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      searxng:
        condition: service_healthy
    networks:
      - all-net

  # Qdrant: vector database (port 6333) backing the MCP memory/RAG servers
  # used by the workspace and codex agents.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped
    networks:
      - all-net

  # Codex CLI workspace: headless container running the OpenAI Codex CLI agent
  # with a full C/C++ toolchain and MCP servers. Streams directly from LM Studio.
  codex:
    build:
      context: .
      dockerfile: Dockerfile.codex
    container_name: codex-cli-workspace
    restart: unless-stopped
    init: true
    user: root
    privileged: true
    command:
      - bash
      - -lc
      - "configure-codex-provider /home/codex/.codex/config.toml; configure-codex-provider --chutes-profile /home/codex/.codex/chutes.config.toml; configure-codex-provider --openrouter-profile /home/codex/.codex/openrouter.config.toml; dockerd --host=unix:///var/run/docker.sock --storage-driver=vfs >/var/log/dockerd.log 2>&1 & for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done; docker info >/dev/null 2>&1 || { cat /var/log/dockerd.log; exit 1; }; exec sleep infinity"
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./workspaces:/workspaces
      - codex_cli_workspace_memory:/home/codex/.mcp-memory
      - codex_dind:/var/lib/docker
    environment:
      - CODEX_LM_STUDIO_API_KEY=lm-studio
      - CODEX_LITELLM_API_KEY=lm-studio
      - CHUTES_CONTEXT_WINDOW=${CHUTES_CONTEXT_WINDOW:-65536}
      - LOCAL_CONTEXT_WINDOW=${LOCAL_CONTEXT_WINDOW:-65536}
      - OPENROUTER_CONTEXT_WINDOW=${OPENROUTER_CONTEXT_WINDOW:-98304}
      - LLM_PROVIDER=${LLM_PROVIDER:-chutes}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - HOME=/home/codex
    depends_on:
      lmstudio:
        condition: service_healthy
      litellm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      searxng:
        condition: service_healthy
    networks:
      - all-net

  # Claude Code CLI workspace: mirrors the Codex development image and routes
  # Anthropic-format Messages API traffic through LiteLLM. Its default model is
  # selected by the same LLM_PROVIDER setting used by Codex and VS Code.
  claude-code:
    build:
      context: .
      dockerfile: Dockerfile.claude-code
    container_name: claude-code-cli-workspace
    restart: unless-stopped
    init: true
    privileged: true
    command:
      - bash
      - -lc
      - "test -f /home/claude/.claude.json || printf '{}\\n' > /home/claude/.claude.json; configure-claude-provider /home/claude/.claude/settings.json; configure-claude-mcp /home/claude/.claude.json; sudo dockerd --host=unix:///var/run/docker.sock --storage-driver=vfs >/tmp/claude-dockerd.log 2>&1 & for i in $(seq 1 30); do docker info >/dev/null 2>&1 && break; sleep 1; done; docker info >/dev/null 2>&1 || { cat /tmp/claude-dockerd.log; exit 1; }; exec sleep infinity"
    security_opt:
      - seccomp:unconfined
    volumes:
      - ./workspaces:/workspaces
      - claude_code_home:/home/claude
      - claude_code_dind:/var/lib/docker
    environment:
      - CHUTES_CONTEXT_WINDOW=${CHUTES_CONTEXT_WINDOW:-65536}
      - LOCAL_CONTEXT_WINDOW=${LOCAL_CONTEXT_WINDOW:-65536}
      - OPENROUTER_CONTEXT_WINDOW=${OPENROUTER_CONTEXT_WINDOW:-98304}
      - LLM_PROVIDER=${LLM_PROVIDER:-chutes}
      - DOCKER_HOST=unix:///var/run/docker.sock
      - HOME=/home/claude
    depends_on:
      lmstudio:
        condition: service_healthy
      litellm:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      searxng:
        condition: service_healthy
    networks:
      - all-net

networks:
  all-net:
    driver: bridge

volumes:
  lmstudio_models:
  webui_data:
  qdrant_data:
  codex_cli_workspace_memory:
  vscode_memory:
  vscode_server:
  vscode_server_insiders:
  vscode_data:
  codex_dind:
  vscode_dind:
  claude_code_home:
  claude_code_dind:
